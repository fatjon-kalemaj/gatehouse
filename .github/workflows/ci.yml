name: ci

on:
  pull_request:
  push:
    branches: [main]
  # usage-logs has no workflow files of its own (it shares no history with main),
  # so the ledger is verified from main: on every push here, every six hours, and on demand.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: gatehouse registry   # fails if a pipeline step is not on the orchestrator roster
      - run: pytest -q

  verify-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch usage-logs
        id: fetch
        run: |
          if git ls-remote --exit-code --heads origin usage-logs >/dev/null; then
            git fetch origin usage-logs:usage-logs
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No usage-logs branch yet; nothing to verify."
          fi
      - uses: actions/setup-python@v5
        if: steps.fetch.outputs.present == 'true'
        with: {python-version: "3.12"}
      - if: steps.fetch.outputs.present == 'true'
        run: pip install -e . && gatehouse verify

  # The two jobs below sync agents and skills to Claude Managed Agents. They are skipped
  # until the repo is connected to a Claude workspace: set repository variable ANT_VERSION
  # (1.40.0 or later) and secret ANTHROPIC_API_KEY for a key scoped to the deal-desk workspace.

  # Shows the plan for agent and skill changes on every pull request.
  ant-apply-dry-run:
    if: github.event_name == 'pull_request' && vars.ANT_VERSION != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25"}
      - run: go install github.com/anthropics/anthropic-cli/cmd/ant@v${{ vars.ANT_VERSION }}
      - run: ant apply --dry-run -v agents environments
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}

  # Applies the plan after merge; the merge is the approval.
  ant-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ANT_VERSION != ''
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit claude-lock.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25"}
      - run: go install github.com/anthropics/anthropic-cli/cmd/ant@v${{ vars.ANT_VERSION }}
      - run: ant apply --yes agents environments
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - run: |
          git config user.name gatehouse-bot
          git config user.email gatehouse-bot@users.noreply.github.com
          git add claude-lock.json
          git diff --cached --quiet || git commit -m "ant apply: record agent versions [skip ci]"
          git push
